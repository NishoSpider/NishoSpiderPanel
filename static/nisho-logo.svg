<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="nishoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0e071a"/>
      <stop offset="100%" stop-color="#07030d"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="cobraScale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#nishoGlow)"/>

  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#shieldGrad)" stroke="#a855f7" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Cobra Hood Silhouette -->
  <path d="M256 95 C190 95, 120 140, 110 230 C105 275, 130 330, 170 370 C210 410, 240 435, 256 445 C272 435, 302 410, 342 370 C382 330, 407 275, 402 230 C392 140, 322 95, 256 95 Z" 
        fill="url(#cobraScale)" 
        stroke="#e9d5ff" 
        stroke-width="3" 
        filter="url(#neonBlur)" 
        opacity="0.95"/>

  <!-- Cobra Hood Inner Ridges / Armor Scales -->
  <path d="M256 125 C215 125, 165 160, 158 230 C154 265, 172 310, 205 345 C230 375, 248 395, 256 405 C264 395, 282 375, 307 345 C340 310, 358 265, 354 230 C347 160, 297 125, 256 125 Z" 
        fill="#0b0614" 
        stroke="#a855f7" 
        stroke-width="2"/>

  <!-- Cobra Head Crown & Scales -->
  <polygon points="256,150 285,185 256,220 227,185" fill="#a855f7" opacity="0.9"/>
  <polygon points="256,120 275,145 256,165 237,145" fill="#c084fc" opacity="0.8"/>
  <polygon points="256,225 295,270 256,315 217,270" fill="url(#purpleNeon)"/>
  <polygon points="256,318 280,355 256,380 232,355" fill="#7e22ce"/>

  <!-- Glowing Eyes -->
  <ellipse cx="230" cy="210" rx="10" ry="14" fill="#ffffff" filter="url(#neonBlur)" transform="rotate(-15 230 210)"/>
  <ellipse cx="230" cy="210" rx="5" ry="12" fill="#d8b4fe" transform="rotate(-15 230 210)"/>

  <ellipse cx="282" cy="210" rx="10" ry="14" fill="#ffffff" filter="url(#neonBlur)" transform="rotate(15 282 210)"/>
  <ellipse cx="282" cy="210" rx="5" ry="12" fill="#d8b4fe" transform="rotate(15 282 210)"/>

  <!-- Sharp Fangs -->
  <polygon points="242,280 248,310 240,312" fill="#ffffff"/>
  <polygon points="270,280 264,310 272,312" fill="#ffffff"/>

  <!-- NISHO Wordmark -->
  <text x="256" y="475" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="8" fill="#f8fafc" stroke="#a855f7" stroke-width="1.5">NISHO</text>
</svg>
